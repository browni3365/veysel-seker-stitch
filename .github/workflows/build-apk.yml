name: APK üret

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ZIP ac
        run: unzip -o veysel-seker-stitch-github.zip -d unpacked

      - name: APK derle
        working-directory: unpacked/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VeyselSeker-APK
          path: unpacked/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
